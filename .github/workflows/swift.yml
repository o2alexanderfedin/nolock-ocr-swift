name: Swift CI/CD

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Swift
      uses: swift-actions/setup-swift@v1
      with:
        swift-version: '5.9'
    
    - name: Build
      run: swift build -v
    
    - name: Run tests
      run: swift test -v
    
    # Commented out for now as we don't have code coverage set up yet
    # - name: Generate code coverage report
    #  run: xcrun llvm-cov export -format="lcov" .build/debug/NolockOCRPackageTests.xctest/Contents/MacOS/NolockOCRPackageTests -instr-profile .build/debug/codecov/default.profdata > coverage.lcov
    
    # - name: Upload coverage to Codecov
    #  uses: codecov/codecov-action@v3
    #  with:
    #    file: ./coverage.lcov
    #    fail_ci_if_error: true

  lint:
    name: Swift Lint
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run SwiftLint
      uses: norio-nomura/action-swiftlint@3.2.1
      with:
        args: --strict

  documentation:
    name: Generate Documentation
    runs-on: macos-latest
    needs: [build-and-test]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Swift
      uses: swift-actions/setup-swift@v1
      with:
        swift-version: '5.9'
    
    - name: Install SwiftDoc
      run: |
        brew update
        brew install swiftdocorg/tap/swift-doc
    
    - name: Generate Documentation
      run: swift-doc generate Sources --module-name NolockOCR --output docs/api
    
    - name: Upload Documentation Artifact
      uses: actions/upload-artifact@v3
      with:
        name: api-documentation
        path: docs/api

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-and-test, lint, documentation]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Download API Documentation
      uses: actions/download-artifact@v3
      with:
        name: api-documentation
        path: docs/api
    
    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
    
    - name: Extract Release Notes
      id: extract_release_notes
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        # Extract the release notes from the CHANGELOG.md file
        NOTES=$(awk -v version="## [$VERSION]" '/^## \[/ { if (p) { exit }; if ($0 ~ version) { p=1; next } } p { print }' CHANGELOG.md)
        # Escape newlines
        NOTES="${NOTES//'%'/'%25'}"
        NOTES="${NOTES//$'\n'/'%0A'}"
        NOTES="${NOTES//$'\r'/'%0D'}"
        echo "NOTES<<EOF" >> $GITHUB_OUTPUT
        echo "$NOTES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: Release ${{ steps.get_version.outputs.VERSION }}
        body: ${{ steps.extract_release_notes.outputs.NOTES }}
        draft: false
        prerelease: false
        files: |
          LICENSE
          README.md
          docs/api/**
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

